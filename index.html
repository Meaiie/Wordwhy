<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vocab Notebook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Vocabulary Notebook</h1>
        </header>

        <section class="card">
            <h2>เพิ่มคำศัพท์ใหม่</h2>
            <form id="addWordForm">
                <input type="text" id="word" placeholder="คำศัพท์" required>
                <input type="text" id="type" placeholder="หน้าที่ (เช่น n., v.)" required>
                <input type="text" id="meaning" placeholder="ความหมาย" required>
                <button type="submit" class="btn-primary">Add</button>
            </form>
            <p id="statusMsg" class="status-message hidden">กำลังบันทึก...</p>
        </section>

        <section class="card text-center">
            <h2>สุ่มทายคำศัพท์</h2>
            <div class="flip-card" id="flipCard">
                <div class="flip-card-inner">
                    <div class="flip-card-front">
                        <p class="hint">อ่านความหมายแล้วทายคำศัพท์นะ!</p>
                        <h3 id="quizMeaning">Loading...</h3>
                        <span id="quizType"></span>
                    </div>
                    <div class="flip-card-back">
                        <p class="hint">เฉลย</p>
                        <h3 id="quizWord">...</h3>
                    </div>
                </div>
            </div>
            
            <div style="margin-top: 1.5rem; display: flex; gap: 0.5rem; justify-content: center; max-width: 350px; margin: 1.5rem auto 0 auto;">
                <input type="text" id="guessInput" placeholder="พิมพ์คำศัพท์ที่นี่..." style="flex: 1; padding: 0.6rem 1rem; border: 1px solid var(--border-color); border-radius: 8px;">
                <button id="checkBtn" class="btn-primary">ส่งคำตอบ</button>
            </div>

            <button id="randomBtn" class="btn-secondary" style="margin-top: 1rem;">สุ่มคำใหม่</button>
        </section>

        <section class="card table-container">
            <table>
                <thead>
                    <tr>
                        <th>คำศัพท์</th>
                        <th>หน้าที่</th>
                        <th>ความหมาย</th>
                    </tr>
                </thead>
                <tbody id="wordList">
                    </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
